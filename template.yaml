AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  ExamHofis Portal & Examination System
  Serverless backend with AWS Cognito, Lambda handlers, and DynamoDB multi-table architecture.

Parameters:
  CognitoUserPoolId:
    Type: String
    Default: ap-south-1_SyTllnO2Y
    Description: Existing Cognito User Pool ID
  CognitoClientId:
    Type: String
    Default: 297qnv5q845tqqafqa60slgf2i
    Description: Existing Cognito App Client ID
  UsersTableName:
    Type: String
    Default: ExamHofis_Users
    Description: Existing DynamoDB Users Table Name
  StudentsTableName:
    Type: String
    Default: ExamHofis_Students
    Description: Existing DynamoDB Students Table Name
  TeachersTableName:
    Type: String
    Default: ExamHofis_Teachers
    Description: Existing DynamoDB Teachers Table Name
  ExamsTableName:
    Type: String
    Default: ExamHofis_Exams
    Description: DynamoDB Exams Table Name
  SubmissionsTableName:
    Type: String
    Default: ExamHofis_Submissions
    Description: DynamoDB Exam Submissions Table Name

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Runtime: nodejs20.x
    Tracing: Active
    Environment:
      Variables:
        USE_AWS: 'true'
        NODE_ENV: production
        DYNAMODB_TABLE_USERS: !Ref UsersTableName
        DYNAMODB_TABLE_STUDENTS: !Ref StudentsTableName
        DYNAMODB_TABLE_TEACHERS: !Ref TeachersTableName
        DYNAMODB_TABLE_EXAMS: !Ref ExamsTableName
        DYNAMODB_TABLE_SUBMISSIONS: !Ref SubmissionsTableName
        COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
        COGNITO_CLIENT_ID: !Ref CognitoClientId

Resources:
  # ============================================================
  # AWS LAMBDA API & ROUTER FUNCTION
  # ============================================================
  ExamHofisApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: lambda/handler.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTableName
        - DynamoDBCrudPolicy:
            TableName: !Ref StudentsTableName
        - DynamoDBCrudPolicy:
            TableName: !Ref TeachersTableName
        - DynamoDBCrudPolicy:
            TableName: !Ref ExamsTableName
        - DynamoDBCrudPolicy:
            TableName: !Ref SubmissionsTableName
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:AdminInitiateAuth
                - cognito-idp:AdminCreateUser
                - cognito-idp:AdminSetUserPassword
                - cognito-idp:AdminDeleteUser
                - cognito-idp:AdminGetUser
                - cognito-idp:AdminAddUserToGroup
                - cognito-idp:AdminRemoveUserFromGroup
                - cognito-idp:ListUsersInGroup
              Resource: !Sub "arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${CognitoUserPoolId}"
      Events:
        HttpApiProxy:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY
        HttpApiRoot:
          Type: HttpApi
          Properties:
            Path: /
            Method: ANY

Outputs:
  ApiEndpoint:
    Description: HTTP API Gateway endpoint URL for ExamHofis
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com"

  CognitoUserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref CognitoUserPoolId

  CognitoClientId:
    Description: Cognito App Client ID
    Value: !Ref CognitoClientId

  UsersTableName:
    Description: DynamoDB Users Table Name
    Value: !Ref UsersTableName

  StudentsTableName:
    Description: DynamoDB Students Table Name
    Value: !Ref StudentsTableName

  TeachersTableName:
    Description: DynamoDB Teachers Table Name
    Value: !Ref TeachersTableName
