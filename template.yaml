AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  ExamHofis Portal & Examination System
  Serverless backend with AWS Cognito, Lambda handlers, and DynamoDB multi-table architecture.

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Runtime: nodejs20.x
    Tracing: Active
    Environment:
      Variables:
        USE_AWS: 'true'
        NODE_ENV: production
        DYNAMODB_TABLE_USERS: !Ref UsersTable
        DYNAMODB_TABLE_STUDENTS: !Ref StudentsTable
        DYNAMODB_TABLE_TEACHERS: !Ref TeachersTable
        COGNITO_USER_POOL_ID: !Ref ExamHofisUserPool
        COGNITO_CLIENT_ID: !Ref ExamHofisUserPoolClient

Resources:
  # ============================================================
  # 1. AWS COGNITO USER POOL & CLIENT
  # ============================================================
  ExamHofisUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: ExamHofis-Users
      UsernameAttributes: []
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 6
          RequireLowercase: false
          RequireNumbers: false
          RequireSymbols: false
          RequireUppercase: false
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
        - Name: name
          AttributeDataType: String
          Mutable: true

  ExamHofisUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: ExamHofis-WebClient
      UserPoolId: !Ref ExamHofisUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_ADMIN_USER_PASSWORD_AUTH
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  AdminUserGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: admin
      Description: ExamHofis System Administrators
      UserPoolId: !Ref ExamHofisUserPool

  TeacherUserGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: teacher
      Description: ExamHofis Faculty Members
      UserPoolId: !Ref ExamHofisUserPool

  StudentUserGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: student
      Description: ExamHofis Enrolled Students
      UserPoolId: !Ref ExamHofisUserPool

  # ============================================================
  # 2. AWS DYNAMODB MULTI-TABLE ARCHITECTURE
  # ============================================================
  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ExamHofis_Users
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: username
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: UsernameIndex
          KeySchema:
            - AttributeName: username
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  StudentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ExamHofis_Students
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: class
          AttributeType: N
        - AttributeName: admission_no
          AttributeType: S
        - AttributeName: user_id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: ClassIndex
          KeySchema:
            - AttributeName: class
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: AdmissionNoIndex
          KeySchema:
            - AttributeName: admission_no
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: UserIdIndex
          KeySchema:
            - AttributeName: user_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  TeachersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ExamHofis_Teachers
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: class
          AttributeType: N
        - AttributeName: subject
          AttributeType: S
        - AttributeName: user_id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: ClassIndex
          KeySchema:
            - AttributeName: class
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: SubjectIndex
          KeySchema:
            - AttributeName: subject
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: UserIdIndex
          KeySchema:
            - AttributeName: user_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  # ============================================================
  # 3. AWS LAMBDA API & ROUTER FUNCTION
  # ============================================================
  ExamHofisApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: lambda/handler.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref StudentsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref TeachersTable
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:AdminInitiateAuth
                - cognito-idp:AdminCreateUser
                - cognito-idp:AdminSetUserPassword
                - cognito-idp:AdminDeleteUser
                - cognito-idp:AdminGetUser
                - cognito-idp:AdminAddUserToGroup
                - cognito-idp:AdminRemoveUserFromGroup
                - cognito-idp:ListUsersInGroup
              Resource: !GetAtt ExamHofisUserPool.Arn
      Events:
        HttpApiProxy:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY
        HttpApiRoot:
          Type: HttpApi
          Properties:
            Path: /
            Method: ANY

Outputs:
  ApiEndpoint:
    Description: HTTP API Gateway endpoint URL for ExamHofis
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com"

  CognitoUserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref ExamHofisUserPool

  CognitoClientId:
    Description: Cognito App Client ID
    Value: !Ref ExamHofisUserPoolClient

  UsersTableName:
    Description: DynamoDB Users Table Name
    Value: !Ref UsersTable

  StudentsTableName:
    Description: DynamoDB Students Table Name
    Value: !Ref StudentsTable

  TeachersTableName:
    Description: DynamoDB Teachers Table Name
    Value: !Ref TeachersTable
